<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Cyan Border Gradient -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Safety Orange Helmet Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- AI Eye Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Hexagonal Shield -->
  <path d="M32 3 L58 13 V34 C58 48 47 58 32 62 C17 58 6 48 6 34 V13 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#cyanBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- 2. Subtle Tech Grid Lines inside Shield -->
  <path d="M32 6 L32 59 M14 20 L50 20 M12 36 L52 36" 
        stroke="#0284c7" 
        stroke-width="0.8" 
        stroke-opacity="0.25" />

  <!-- 3. Safety Construction Hard Hat (Mũ Bảo Hộ) -->
  <!-- Top Dome -->
  <path d="M20 28 C20 18 25 15 32 15 C39 15 44 18 44 28 Z" 
        fill="url(#helmetGrad)" />

  <!-- Helmet Ridge / Rib -->
  <path d="M30 15 H34 V28 H30 Z" 
        fill="#fef3c7" 
        opacity="0.8" />

  <!-- Helmet Brim -->
  <path d="M15 28 C15 26.5 17 26 21 26 H43 C47 26 49 26.5 49 28 C49 30 46 31 32 31 C18 31 15 30 15 28 Z" 
        fill="#f59e0b" 
        stroke="#b45309" 
        stroke-width="0.8" />

  <!-- 4. AI Vision Radar / Targeting Reticle -->
  <circle cx="32" cy="42" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#glow)"/>
  <circle cx="32" cy="42" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Reticle Crosshairs -->
  <line x1="32" y1="31" x2="32" y2="35" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="32" y1="49" x2="32" y2="53" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="21" y1="42" x2="25" y2="42" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="39" y1="42" x2="43" y2="42" stroke="#38bdf8" stroke-width="1.5" />
</svg>